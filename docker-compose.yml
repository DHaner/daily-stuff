# Daily Stuff on the homelab: PostgreSQL + API (with uploaded files) + web (nginx).
#   cp .env.example .env   # set POSTGRES_PASSWORD
#   docker compose up -d --build
# The app is served on http://<host>:${WEB_PORT:-8080}

name: daily-stuff

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dailystuff
      POSTGRES_USER: dailystuff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailystuff -d dailystuff"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${SERVER_IMAGE:-daily-stuff-server}:${IMAGE_TAG:-latest}
    build: ./daily-stuff.Server
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=dailystuff;Username=dailystuff;Password=${POSTGRES_PASSWORD}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  client:
    image: ${CLIENT_IMAGE:-daily-stuff-client}:${IMAGE_TAG:-latest}
    build: ./daily-stuff.client
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  db-data:
  uploads:
