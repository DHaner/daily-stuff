name: CI

on:
  pull_request:
    paths:
      - "daily-stuff.Server/**"
      - "daily-stuff.client/**"
      - "docker-compose*.yml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "daily-stuff.Server/**"
      - "daily-stuff.client/**"
      - "docker-compose*.yml"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-stuff.Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release --warnaserror
      # Add `dotnet test` here once the repo has a test project.

  client:
    name: Client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-stuff.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daily-stuff.client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: daily-stuff.Server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: daily-stuff.client
          push: false
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max
