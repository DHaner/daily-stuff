name: CD

# Builds the images, pushes them to GHCR and redeploys the stack on the homelab
# through a self-hosted runner (the homelab is not reachable from GitHub's runners).

on:
  push:
    branches: [main]
    paths:
      - "daily-stuff.Server/**"
      - "daily-stuff.client/**"
      - "docker-compose.yml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server_image: ${{ steps.names.outputs.server }}
      client_image: ${{ steps.names.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - id: names
        # GHCR image names must be lowercase.
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "server=${REGISTRY}/${owner}/daily-stuff-server" >> "$GITHUB_OUTPUT"
          echo "client=${REGISTRY}/${owner}/daily-stuff-client" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: daily-stuff.Server
          push: true
          tags: |
            ${{ steps.names.outputs.server }}:latest
            ${{ steps.names.outputs.server }}:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: daily-stuff.client
          push: true
          tags: |
            ${{ steps.names.outputs.client }}:latest
            ${{ steps.names.outputs.client }}:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

  deploy:
    name: Deploy to homelab
    needs: publish
    runs-on: self-hosted
    environment: homelab
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write .env
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          WEB_PORT=${{ vars.WEB_PORT || '8080' }}
          SERVER_IMAGE=${{ needs.publish.outputs.server_image }}
          CLIENT_IMAGE=${{ needs.publish.outputs.client_image }}
          IMAGE_TAG=${{ github.sha }}
          EOF
      - run: docker compose pull
      - run: docker compose up -d --remove-orphans
      - run: docker image prune -f
