server {
    listen 80;
    server_name _;

    # Photos and attachments are uploaded through /api (the API caps them at 25 MB).
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API lives in the server container; the browser only ever talks to this origin.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (TanStack Router) fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
